# Local stack: ClickHouse with schema + demo data, and the Insights API.
#   docker compose up --build
#   python3 scripts/make_token.py --tenant tesco --role RETAILER
services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    environment:
      CLICKHOUSE_DB: insights
      CLICKHOUSE_USER: insights
      CLICKHOUSE_PASSWORD: insights
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
    volumes:
      - ./docker/clickhouse/init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  insights-api:
    build: .
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_URL: jdbc:clickhouse://clickhouse:8123/insights
      CLICKHOUSE_USER: insights
      CLICKHOUSE_PASSWORD: insights
      # Local-only signing secret. Production uses JWT_ISSUER_URI instead.
      JWT_HMAC_SECRET: local-dev-secret-change-me-0123456789abcdef
    ports:
      - "8080:8080"
